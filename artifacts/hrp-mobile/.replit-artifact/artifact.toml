kind = "mobile"
previewPath = "/hrp-mobile/"
title = "تتبع الحمل عالي الخطورة – جازان"
version = "1.0.0"
id = "artifacts/hrp-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/hrp-mobile/" ]
localPort = 21118

[services.development]
run = "pnpm --filter @workspace/hrp-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hrp-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hrp-mobile", "run", "serve" ]

[services.env]
PORT = "21118"
BASE_PATH = "/hrp-mobile/"
