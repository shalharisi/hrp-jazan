name: Validate CODEOWNERS

# Run on every pull request so this status check is always reported to GitHub.
# Branch protection requires the check to be present on every PR; a path-filtered
# trigger would cause the check to never appear on PRs that don't touch CODEOWNERS,
# which GitHub treats as "pending" and blocks merging indefinitely.
#
# The validation step itself exits 0 immediately when CODEOWNERS was not modified,
# keeping overhead negligible for unrelated PRs.

on:
  pull_request:
    branches: ["**"]

# Token strategy for team validation
# ─────────────────────────────────────────────────────────────────────────────
# GitHub's default GITHUB_TOKEN does not include read:org scope.  Calls to
# /orgs/{org}/teams/{team} will fail silently for team entries (@org/team)
# when the token lacks that scope, causing false-negative failures.
#
# To fix this, create a fine-grained or classic PAT with the `read:org` scope
# (classic PAT) or the "Members" organisation permission set to "Read-only"
# (fine-grained PAT), then store it as a repository secret named GH_PAT:
#
#   GitHub → repository → Settings → Secrets and variables → Actions
#   → New repository secret → Name: GH_PAT  → Value: <your PAT>
#
# When GH_PAT is present it is used automatically; if it is absent the
# workflow falls back to GITHUB_TOKEN (fine for user-only CODEOWNERS files).

permissions:
  contents: read   # for checkout + git diff

jobs:
  validate-codeowners:
    name: Verify CODEOWNERS entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base branch

      - name: Check if CODEOWNERS was modified in this PR
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD -- .github/CODEOWNERS | grep -q 'CODEOWNERS'; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for owner-less rules
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"
          failed=0

          echo "Checking for CODEOWNERS rules with no owners listed …"
          echo ""

          while IFS= read -r line; do
            # Skip comment lines and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue

            # Tokenise: field 0 is the path pattern, fields 1+ are owner tokens
            read -r -a fields <<< "$line"

            if [[ ${#fields[@]} -lt 2 ]]; then
              echo "✗  Owner-less rule: '${fields[0]}'"
              echo "   This pattern has no owners — GitHub will silently disable"
              echo "   code-owner review for matching paths."
              failed=1
            else
              echo "✓  ${fields[0]}"
            fi
          done < "$CODEOWNERS"

          echo ""
          if [[ $failed -ne 0 ]]; then
            echo "ERROR: One or more CODEOWNERS rules have no owners listed."
            echo ""
            echo "A pattern with no '@owner' tokens is accepted by GitHub but"
            echo "effectively removes review coverage for those paths."
            echo ""
            echo "How to fix:"
            echo "  • Add at least one '@username' or '@org/team-slug' owner to the rule."
            echo "  • Remove the rule entirely if coverage is no longer needed."
            exit 1
          fi

          echo "All CODEOWNERS rules have at least one owner."

      - name: Check for duplicate owners on the same rule line
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"
          failed=0
          lineno=0

          echo "Checking for duplicate owner tokens within a single CODEOWNERS rule …"
          echo ""

          while IFS= read -r line; do
            lineno=$((lineno + 1))

            # Skip comment lines and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue

            # Tokenise: field 0 is the path pattern, fields 1+ are owner tokens
            read -r -a fields <<< "$line"

            # Need at least two owners for a duplicate to be possible
            if [[ ${#fields[@]} -lt 3 ]]; then
              echo "✓  Line $lineno: '${fields[0]}'"
              continue
            fi

            # Check for repeated tokens among the owner fields (index 1+)
            declare -A seen_owners
            dupes=()
            for (( i=1; i<${#fields[@]}; i++ )); do
              token="${fields[$i]}"
              if [[ -n "${seen_owners[$token]+_}" ]]; then
                dupes+=("$token")
              else
                seen_owners[$token]=1
              fi
            done
            unset seen_owners

            if [[ ${#dupes[@]} -gt 0 ]]; then
              # Deduplicate the reported tokens for a cleaner message
              declare -A reported
              unique_dupes=()
              for t in "${dupes[@]}"; do
                if [[ -z "${reported[$t]+_}" ]]; then
                  unique_dupes+=("$t")
                  reported[$t]=1
                fi
              done
              unset reported

              echo "✗  Line $lineno: '${fields[0]}' — duplicate owner(s): ${unique_dupes[*]}"
              echo "   Full rule: $line"
              echo "   Listing the same reviewer twice is redundant and misleading;"
              echo "   GitHub requests each owner only once regardless."
              failed=1
            else
              echo "✓  Line $lineno: '${fields[0]}'"
            fi
          done < "$CODEOWNERS"

          echo ""
          if [[ $failed -ne 0 ]]; then
            echo "ERROR: One or more CODEOWNERS rules list the same owner more than once."
            echo ""
            echo "How to fix:"
            echo "  • Remove the duplicate '@username' or '@org/team-slug' tokens so each"
            echo "    owner appears exactly once on the rule line."
            exit 1
          fi

          echo "No duplicate owners found within any single CODEOWNERS rule."

      - name: Validate every owner resolves via the GitHub API
        if: steps.changed.outputs.modified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"
          failed=0
          declare -A seen   # deduplicate owners across lines

          echo "CODEOWNERS was modified — validating all entries …"
          echo ""

          while IFS= read -r line; do
            # Skip comment lines and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue

            # Tokenise: field 0 is the path pattern, fields 1+ are owner tokens
            read -r -a fields <<< "$line"

            # Fail loudly when a rule has no owners — GitHub silently skips such
            # rules and requests no review, which defeats the purpose of the entry.
            if [[ ${#fields[@]} -lt 2 ]]; then
              echo "✗  No owners listed for pattern '${fields[0]}' on line: $line"
              echo "   Every rule must have at least one owner token (e.g. @username or @org/team-slug)."
              echo "   A rule with no owners is valid CODEOWNERS syntax but GitHub will never"
              echo "   request a review for matching files, silently bypassing code review."
              failed=1
              continue
            fi

            for (( i=1; i<${#fields[@]}; i++ )); do
              token="${fields[$i]}"

              # Every valid CODEOWNERS owner must start with @.
              # Anything else is a malformed entry — fail loudly rather than silently skip.
              if [[ "$token" != @* ]]; then
                echo "✗  Invalid owner token '$token' on line: $line"
                echo "   All owners must start with '@' (e.g. @username or @org/team-slug)."
                failed=1
                continue
              fi

              handle="${token:1}"   # strip leading @

              # Skip duplicates
              [[ -n "${seen[$handle]+_}" ]] && continue
              seen[$handle]=1

              if [[ "$handle" == */* ]]; then
                # ── Team: @org/team-slug ──────────────────────────────────────
                org="${handle%%/*}"
                team="${handle#*/}"
                printf "Checking team   %-50s " "@$handle"
                if gh api "/orgs/$org/teams/$team" --silent 2>/dev/null; then
                  echo "✓"
                else
                  echo "✗  NOT FOUND"
                  echo "   The team may have been renamed or deleted, or the token"
                  echo "   lacks read:org scope. Add a repository secret named GH_PAT"
                  echo "   (classic PAT with read:org, or fine-grained PAT with Members"
                  echo "   read-only) — see the comment at the top of this workflow and"
                  echo "   the 'CODEOWNERS team validation' section in CONTRIBUTING.md."
                  failed=1
                fi
              else
                # ── Individual user: @username ────────────────────────────────
                printf "Checking user   %-50s " "@$handle"
                if gh api "/users/$handle" --silent 2>/dev/null; then
                  echo "✓"
                else
                  echo "✗  NOT FOUND (account renamed or deleted)"
                  failed=1
                fi
              fi
            done
          done < "$CODEOWNERS"

          echo ""
          if [[ $failed -ne 0 ]]; then
            echo "ERROR: One or more CODEOWNERS entries are invalid."
            echo ""
            echo "Fix the entries above before merging this PR."
            echo ""
            echo "Tips:"
            echo "  • Rule with no owners → add at least one @username or @org/team-slug"
            echo "    owner after the path pattern, or remove the rule entirely."
            echo "  • Team renamed/deleted → update the slug in .github/CODEOWNERS."
            echo "  • Username renamed/deleted → update or remove the @username entry."
            echo "  • Token lacks read:org → add a repository secret GH_PAT (classic"
            echo "    PAT with read:org scope, or fine-grained PAT with Members read-only)."
            echo "    The workflow uses GH_PAT automatically when the secret is present."
            echo "    See the token-strategy comment at the top of this file and the"
            echo "    'CODEOWNERS team validation' section in CONTRIBUTING.md."
            exit 1
          fi

          echo "All CODEOWNERS entries resolved successfully."

      - name: Check that every path pattern matches at least one tracked file
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"
          failed=0
          unmatched=()

          echo "Checking that every CODEOWNERS path pattern matches at least one tracked file …"
          echo ""

          while IFS= read -r line; do
            # Skip comment lines and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue

            # Field 0 is the path pattern; remaining fields are owners
            read -r -a fields <<< "$line"
            pattern="${fields[0]}"

            # Skip the universal wildcard — it always matches every file
            [[ "$pattern" == "*" ]] && continue

            # Strip a leading / (CODEOWNERS anchors with /, git ls-files uses repo-relative paths)
            pattern="${pattern#/}"

            if git ls-files -- "$pattern" | grep -q .; then
              echo "✓  $pattern"
            else
              echo "✗  Pattern matches no tracked files: $pattern"
              unmatched+=("$pattern")
              failed=1
            fi
          done < "$CODEOWNERS"

          echo ""
          if [[ $failed -ne 0 ]]; then
            echo "ERROR: The following CODEOWNERS patterns match no tracked files:"
            for p in "${unmatched[@]}"; do
              echo "  • $p"
            done
            echo ""
            echo "These patterns are silently ignored by GitHub — no review will ever"
            echo "be requested for matching paths. Remove or update the dead entries."
            exit 1
          fi

          echo "All CODEOWNERS path patterns match at least one tracked file."

      - name: Check for fully-shadowed CODEOWNERS rules
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"

          echo "Checking for fully-shadowed CODEOWNERS rules …"
          echo "(GitHub applies only the LAST matching rule per file; an earlier rule"
          echo " whose entire file set is covered by later rules will never apply.)"
          echo ""

          # ── Parse rules: collect (line_number, pattern) in declaration order ──
          declare -a pat_arr lineno_arr
          idx=0
          lineno=0

          while IFS= read -r raw; do
            lineno=$((lineno + 1))
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${raw//[[:space:]]/}" ]] && continue
            read -r -a fields <<< "$raw"
            pat_arr[$idx]="${fields[0]}"
            lineno_arr[$idx]=$lineno
            idx=$((idx + 1))
          done < "$CODEOWNERS"

          total=$idx

          if [[ $total -eq 0 ]]; then
            echo "No rules found in CODEOWNERS — nothing to check."
            exit 0
          fi

          # ── Build per-rule file lists in a temp directory ─────────────────────
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          for (( i=0; i<total; i++ )); do
            p="${pat_arr[$i]}"
            clean="${p#/}"
            if [[ "$p" == "*" ]]; then
              git ls-files > "$tmpdir/$i.txt"
            else
              git ls-files -- "$clean" > "$tmpdir/$i.txt"
            fi
          done

          # ── Shadow detection ───────────────────────────────────────────────────
          # Rule i is "fully shadowed" when every file it matches is also matched
          # by at least one rule j where j > i.  The last rule in the file can
          # never be shadowed, so we only check indices 0 … total-2.
          shadowed=0

          for (( i=0; i<total-1; i++ )); do
            # Rules with no matched files are already caught by the previous step;
            # skip them here to avoid false positives.
            [[ ! -s "$tmpdir/$i.txt" ]] && continue

            all_covered=true
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              file_covered=false
              for (( j=i+1; j<total; j++ )); do
                if grep -qxF "$f" "$tmpdir/$j.txt" 2>/dev/null; then
                  file_covered=true
                  break
                fi
              done
              if [[ "$file_covered" == false ]]; then
                all_covered=false
                break
              fi
            done < "$tmpdir/$i.txt"

            if [[ "$all_covered" == true ]]; then
              echo "✗  Line ${lineno_arr[$i]}: '${pat_arr[$i]}' is fully shadowed by later rule(s) — its owners will never be requested for review."
              shadowed=1
            else
              echo "✓  Line ${lineno_arr[$i]}: '${pat_arr[$i]}'"
            fi
          done

          # The last rule can never be shadowed; report it as always active.
          last=$((total - 1))
          echo "✓  Line ${lineno_arr[$last]}: '${pat_arr[$last]}' (last rule — never shadowed)"

          echo ""
          if [[ $shadowed -ne 0 ]]; then
            echo "ERROR: One or more CODEOWNERS rules are fully shadowed and will never apply."
            echo ""
            echo "Because GitHub applies only the LAST matching rule for a given file,"
            echo "any earlier rule whose entire matched-file set is also covered by later"
            echo "rules becomes a dead rule: its owners are silently skipped."
            echo ""
            echo "How to fix:"
            echo "  • Remove the shadowed rule if it is truly redundant."
            echo "  • Move it below the rules that shadow it so it becomes the last match."
            echo "  • Narrow the later rules so the earlier one still applies to some files."
            exit 1
          fi

          echo "No fully-shadowed CODEOWNERS rules detected."

      - name: Check for duplicate path patterns in CODEOWNERS
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"

          echo "Checking for duplicate path patterns in CODEOWNERS …"
          echo "(GitHub applies only the LAST matching rule per file; an earlier"
          echo " rule with the exact same pattern is permanently dead.)"
          echo ""

          # ── Collect all occurrences per pattern ────────────────────────────────
          # occurrences[$pattern] = newline-separated "lineno|owners" records in
          # declaration order.  is_dup[$pattern] is set once a second occurrence
          # is seen so we can iterate only over duplicated patterns at report time.
          declare -A occurrences  # pattern → newline-separated "lineno|owners" entries
          declare -A is_dup       # pattern → 1 when the pattern appears 2+ times
          lineno=0
          found_dupes=0

          while IFS= read -r raw; do
            lineno=$((lineno + 1))
            [[ "$raw" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${raw//[[:space:]]/}" ]] && continue

            read -r -a fields <<< "$raw"
            pattern="${fields[0]}"
            # Build a canonical owners string (space-separated, fields 1+)
            owners="${fields[*]:1}"

            if [[ -z "${occurrences[$pattern]+_}" ]]; then
              occurrences[$pattern]="$lineno|$owners"
            else
              occurrences[$pattern]+=$'\n'"$lineno|$owners"
              is_dup[$pattern]=1
              found_dupes=1
            fi
          done < "$CODEOWNERS"

          # ── Report ─────────────────────────────────────────────────────────────
          if [[ $found_dupes -ne 0 ]]; then
            echo "ERROR: The following path patterns appear more than once."
            echo "       Only the LAST occurrence is active; all earlier ones are dead rules."
            echo ""
            for pattern in "${!is_dup[@]}"; do
              echo "  Pattern: $pattern"

              # Parse the ordered occurrence list for this pattern
              occ_linenos=()
              occ_owners=()
              while IFS='|' read -r ln ow; do
                occ_linenos+=("$ln")
                occ_owners+=("$ow")
              done <<< "${occurrences[$pattern]}"

              # Print every occurrence with its line number and owners
              total_occ=${#occ_linenos[@]}
              for (( i=0; i<total_occ; i++ )); do
                if (( i == total_occ - 1 )); then
                  echo "    Line ${occ_linenos[$i]}: ${occ_owners[$i]}  ← active (last occurrence)"
                else
                  echo "    Line ${occ_linenos[$i]}: ${occ_owners[$i]}"
                fi
              done

              # Check whether all occurrences share identical owners
              first_ow="${occ_owners[0]}"
              all_same=true
              for ow in "${occ_owners[@]}"; do
                if [[ "$ow" != "$first_ow" ]]; then
                  all_same=false
                  break
                fi
              done

              if [[ "$all_same" == true ]]; then
                echo "    → Owners are identical on all occurrences. Delete all but the last occurrence."
              else
                # Build the unique owner set across ALL occurrences (preserving first-seen order)
                unset seen_tokens
                declare -A seen_tokens
                unique_owners=""
                for ow in "${occ_owners[@]}"; do
                  for tok in $ow; do
                    if [[ -z "${seen_tokens[$tok]+_}" ]]; then
                      seen_tokens[$tok]=1
                      unique_owners+=" $tok"
                    fi
                  done
                done
                unique_owners="${unique_owners# }"  # trim leading space

                echo "    → Occurrences list DIFFERENT owners. GitHub silently drops all but"
                echo "      the last rule, so earlier owner lists will never be used."
                echo "      Consolidate all intended owners onto a single line, e.g.:"
                echo "        $pattern $unique_owners"
              fi
              echo ""
            done
            exit 1
          fi

          echo "No duplicate path patterns found in CODEOWNERS."

      - name: Check that every top-level artifacts/ and lib/ directory has a specific owner
        if: steps.changed.outputs.modified == 'true'
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"

          echo "Checking that every top-level directory under artifacts/ and lib/ has a specific CODEOWNERS rule …"
          echo "(Directories covered only by the catch-all '*' have no designated reviewer.)"
          echo ""

          # Collect every unique top-level subdirectory under artifacts/ and lib/
          # that contains at least one tracked file.
          mapfile -t dirs < <(
            git ls-files artifacts/ lib/ \
              | awk -F/ 'NF>=2{print $1"/"$2}' \
              | sort -u
          )

          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No tracked directories found under artifacts/ or lib/ — nothing to check."
            exit 0
          fi

          # Pre-build a list of (pattern, file-list) for every non-wildcard rule so we
          # only call git ls-files once per pattern, not once per pattern per directory.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          idx=0
          declare -a pat_arr

          while IFS= read -r line; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            read -r -a fields <<< "$line"
            pattern="${fields[0]}"
            [[ "$pattern" == "*" ]] && continue          # skip catch-all
            clean="${pattern#/}"                          # strip leading /
            git ls-files -- "$clean" > "$tmpdir/$idx.txt" 2>/dev/null || true
            pat_arr[$idx]="$pattern"
            idx=$((idx + 1))
          done < "$CODEOWNERS"

          total=$idx

          # For each directory, check whether at least one specific rule covers it
          failed=0
          unowned=()

          for dir in "${dirs[@]}"; do
            covered=false
            for (( i=0; i<total; i++ )); do
              if grep -q "^${dir}/" "$tmpdir/$i.txt" 2>/dev/null; then
                covered=true
                break
              fi
            done

            if [[ "$covered" == true ]]; then
              echo "✓  $dir"
            else
              echo "✗  $dir — no specific CODEOWNERS rule (only the catch-all '*' applies)"
              unowned+=("$dir")
              failed=1
            fi
          done

          echo ""
          if [[ $failed -ne 0 ]]; then
            echo "ERROR: The following directories have no specific CODEOWNERS rule:"
            for d in "${unowned[@]}"; do
              echo "  • $d"
            done
            echo ""
            echo "Add a rule for each directory to .github/CODEOWNERS so that a"
            echo "designated reviewer is always requested when changes are made there."
            echo ""
            echo "Example:"
            for d in "${unowned[@]}"; do
              echo "  ${d}/    @jazan-health/<team-slug>"
            done
            exit 1
          fi

          echo "All top-level artifacts/ and lib/ directories have a specific CODEOWNERS rule."

      - name: Skip — CODEOWNERS not modified in this PR
        if: steps.changed.outputs.modified == 'false'
        run: echo "CODEOWNERS was not modified in this PR — validation skipped."

  check-stale-paths:
    name: Fail if stale CODEOWNERS paths remain after a directory rename
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base branch

      - name: Detect renamed directories and fail on stale CODEOWNERS entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"

          # ── 1. Collect all file-level renames in this PR ─────────────────────
          # Output format: R<score> TAB old-path TAB new-path
          mapfile -t rename_lines < <(
            git diff --diff-filter=R --name-status "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          )

          if [[ ${#rename_lines[@]} -eq 0 ]]; then
            echo "No renamed files in this PR — CODEOWNERS stale-path check skipped."
            exit 0
          fi

          echo "Renamed files detected in this PR:"
          for line in "${rename_lines[@]}"; do
            echo "  $line"
          done
          echo ""

          # ── 2. Infer directory renames from the file renames ─────────────────
          # A directory rename shows up as many files sharing the same old-prefix
          # → new-prefix transformation.  We record unique top-level dir pairs.

          declare -A dir_renames   # old_dir/ -> new_dir/

          for line in "${rename_lines[@]}"; do
            old_path=$(echo "$line" | awk '{print $2}')
            new_path=$(echo "$line" | awk '{print $3}')

            old_dir=$(dirname "$old_path")
            new_dir=$(dirname "$new_path")

            [[ "$old_dir" == "." ]] && continue
            [[ "$new_dir" == "." ]] && continue
            [[ "$old_dir" == "$new_dir" ]] && continue

            a="$old_dir"
            b="$new_dir"
            while [[ "$a" != "." && "$b" != "." ]]; do
              a_parent=$(dirname "$a")
              b_parent=$(dirname "$b")
              if [[ "$a_parent" == "$b_parent" ]]; then
                dir_renames["${a}/"]="${b}/"
                break
              fi
              a="$a_parent"
              b="$b_parent"
            done
          done

          if [[ ${#dir_renames[@]} -eq 0 ]]; then
            echo "No directory renames inferred from file renames — nothing to check in CODEOWNERS."
            exit 0
          fi

          echo "Inferred directory renames:"
          for old in "${!dir_renames[@]}"; do
            echo "  $old  →  ${dir_renames[$old]}"
          done
          echo ""

          # ── 3. Scan CODEOWNERS for rules that still reference the old paths ──
          # A pattern is only stale when BOTH conditions hold:
          #   a) it matches an inferred old-directory prefix, AND
          #   b) it matches zero tracked files on the PR HEAD
          #      (i.e. the path no longer exists in the repo after the rename).
          # Condition (b) prevents false positives when only some files were moved
          # out of a directory (partial move) — the old path still has files and
          # the CODEOWNERS rule is still active and valid.
          stale=0
          declare -a stale_entries

          while IFS= read -r rule_line; do
            [[ "$rule_line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${rule_line//[[:space:]]/}" ]] && continue

            read -r -a fields <<< "$rule_line"
            pattern="${fields[0]}"
            # Skip the universal wildcard — it always matches every file
            [[ "$pattern" == "*" ]] && continue
            pattern_stripped="${pattern#/}"

            for old_dir in "${!dir_renames[@]}"; do
              new_dir="${dir_renames[$old_dir]}"
              if [[ "$pattern_stripped" == "${old_dir}"* ]] || \
                 [[ "$pattern_stripped" == "${old_dir%/}" ]]; then

                # Only flag as stale if the old path has no tracked files on HEAD.
                # If files are still present the directory was not fully renamed
                # (partial move) and the rule is still legitimate.
                if git ls-files -- "$pattern_stripped" | grep -q .; then
                  echo "✓  $pattern  (path still has tracked files on HEAD — not stale)"
                  continue
                fi

                updated="${pattern/$old_dir/$new_dir}"
                updated="${updated/${old_dir%/}/${new_dir%/}}"
                stale_entries+=("  stale:    $pattern")
                stale_entries+=("  expected: $updated")
                stale_entries+=("")
                stale=1
                echo "✗  $pattern  (path matches no tracked files on HEAD — stale)"
              fi
            done
          done < "$CODEOWNERS"
          echo ""

          if [[ $stale -ne 0 ]]; then
            echo "ERROR: This PR renames tracked directories but .github/CODEOWNERS still"
            echo "       references the old paths.  GitHub silently ignores rules whose"
            echo "       path no longer exists, so review will be skipped until fixed."
            echo ""
            echo "Stale entries found:"
            for entry in "${stale_entries[@]}"; do
              echo "$entry"
            done
            echo "Update .github/CODEOWNERS in this PR to replace the stale patterns above"
            echo "before merging, or remove the entries if the rule is no longer needed."
            exit 1
          fi

          echo "No stale CODEOWNERS paths detected — all renamed directories have been"
          echo "accounted for in .github/CODEOWNERS (or are not tracked there)."
