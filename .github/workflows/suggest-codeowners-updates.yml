name: Suggest CODEOWNERS Updates

# Runs on every PR so it catches directory renames regardless of whether
# CODEOWNERS itself was touched.  When no renames affect a tracked CODEOWNERS
# path the job exits in a few seconds with no side-effects.
#
# ── Dry-run mode ─────────────────────────────────────────────────────────────
# By default the bot commits and pushes the CODEOWNERS fix automatically.
# To preview changes without committing, enable dry-run mode in one of two
# ways:
#
#   1. Repository variable  (Settings → Variables → Actions):
#        CODEOWNERS_BOT_DRY_RUN = true
#      This turns dry-run on globally for every PR in the repository.
#
#   2. PR label:
#        codeowners-dry-run
#      Add this label to a specific PR to preview changes for that PR only.
#      Remove the label to let the bot auto-commit on the next push.
#
# In dry-run mode the bot will NOT push any commit; it posts a comment that
# clearly states it is in dry-run mode and lists the pending changes.  A human
# reviewer must apply the changes manually (or remove the dry-run trigger) and
# push before merging.
#
# ── Require-approval mode ─────────────────────────────────────────────────────
# For teams that always want a human sign-off before the bot auto-commits, set:
#
#   Repository variable  (Settings → Variables → Actions):
#     CODEOWNERS_BOT_REQUIRE_APPROVAL = true
#
# When this variable is true the bot will:
#   • Post a dry-run preview comment on every PR push until a maintainer
#     approves the change via one of these two mechanisms:
#       – Submit a GitHub review with "Approved" state on the PR, OR
#       – React with :+1: to the bot's own comment.
#   • Once either approval signal is detected the bot will auto-commit on the
#     next workflow run (next push to the branch).
#
# This variable is independent of CODEOWNERS_BOT_DRY_RUN.  If both are set to
# true, dry-run mode always wins regardless of approval state.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: write         # for checkout + git diff + pushing the auto-fix commit
  pull-requests: write    # for posting review comments and reading PR reviews
  issues: read            # for reading reactions on bot comments

jobs:
  suggest-codeowners-updates:
    name: Detect renamed directories and update CODEOWNERS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the PR base branch
          # Use the default GITHUB_TOKEN so the push is attributed to the bot.
          # For fork PRs this token is read-only, which is fine — we fall back
          # to comment-only mode in that case.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect renames and auto-update CODEOWNERS (or post suggestions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          # Dry-run via repository variable (true/false string)
          DRY_RUN_VAR: ${{ vars.CODEOWNERS_BOT_DRY_RUN }}
          # Require-approval via repository variable (true/false string)
          REQUIRE_APPROVAL_VAR: ${{ vars.CODEOWNERS_BOT_REQUIRE_APPROVAL }}
          # PR labels as a JSON array for label-based dry-run detection
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          CODEOWNERS=".github/CODEOWNERS"

          # ── 0. Resolve dry-run mode ───────────────────────────────────────
          # Dry-run is active when the repository variable is "true" (case-
          # insensitive) OR when the PR carries the "codeowners-dry-run" label.
          DRY_RUN=false

          if [[ "${DRY_RUN_VAR,,}" == "true" ]]; then
            DRY_RUN=true
            echo "Dry-run enabled via repository variable CODEOWNERS_BOT_DRY_RUN=true."
          fi

          if echo "${PR_LABELS}" | grep -qi '"codeowners-dry-run"'; then
            DRY_RUN=true
            echo "Dry-run enabled via PR label 'codeowners-dry-run'."
          fi

          # ── 0a. Resolve require-approval mode ────────────────────────────
          # When CODEOWNERS_BOT_REQUIRE_APPROVAL=true the bot stays in dry-run
          # until a maintainer either approves the PR via a GitHub review or
          # reacts with :+1: on the bot's own comment.
          #
          # This check is skipped entirely if dry-run mode is already active via
          # the DRY_RUN_VAR or PR label — those take unconditional precedence.
          APPROVAL_REQUIRED=false

          if [[ "${REQUIRE_APPROVAL_VAR,,}" == "true" && "$DRY_RUN" == "false" ]]; then
            echo "CODEOWNERS_BOT_REQUIRE_APPROVAL=true — checking for approval before auto-committing."

            APPROVED=false
            MARKER="<!-- codeowners-rename-bot -->"

            # Check for a GitHub review approval from a maintainer on this PR.
            # Steps:
            #   1. Take the latest review per reviewer (so a later CHANGES_REQUESTED
            #      supersedes an earlier APPROVED from the same person).
            #   2. Filter to those whose net state is APPROVED.
            #   3. For each such reviewer, check their repo permission via the
            #      collaborator API and only accept write/maintain/admin.
            mapfile -t approved_reviewer_logins < <(
              gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
                --jq '
                  group_by(.user.login) |
                  map(sort_by(.submitted_at) | last) |
                  map(select(.state == "APPROVED")) |
                  .[].user.login
                ' \
                2>/dev/null || true
            )

            for login in "${approved_reviewer_logins[@]}"; do
              perm=$(
                gh api "repos/$REPO/collaborators/$login/permission" \
                  --jq '.permission' \
                  2>/dev/null || echo "none"
              )
              case "$perm" in
                write|maintain|admin)
                  APPROVED=true
                  echo "Approval detected: maintainer '$login' approved via GitHub review (permission: $perm)."
                  break
                  ;;
                *)
                  echo "Ignoring review approval from '$login' — insufficient permission ($perm)."
                  ;;
              esac
            done

            # If no review approval yet, check for a :+1: reaction on the most
            # recent bot comment (if one has already been posted).
            # Security: only count reactions from users with write/maintain/admin
            # permission to prevent non-maintainers from unlocking auto-commit.
            if [[ "$APPROVED" == "false" ]]; then
              # Look up the most recent comment posted by github-actions[bot]
              # that carries the bot marker — verify both marker AND author to
              # prevent a spoofed marker comment from being used as the target.
              existing_comment_id=$(
                gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                  --jq ".[] | select(
                    (.body | startswith(\"$MARKER\")) and
                    (.user.login == \"github-actions[bot]\")
                  ) | .id" \
                  2>/dev/null | tail -1 || true
              )

              if [[ -n "$existing_comment_id" ]]; then
                # Collect logins of all users who reacted with :+1:
                mapfile -t reactor_logins < <(
                  gh api "repos/$REPO/issues/comments/$existing_comment_id/reactions" \
                    --jq '.[] | select(.content == "+1") | .user.login' \
                    2>/dev/null || true
                )

                for login in "${reactor_logins[@]}"; do
                  # Accept the reaction only if the user has at least write
                  # (push) permission on the repository.
                  perm=$(
                    gh api "repos/$REPO/collaborators/$login/permission" \
                      --jq '.permission' \
                      2>/dev/null || echo "none"
                  )
                  case "$perm" in
                    write|maintain|admin)
                      APPROVED=true
                      echo "Approval detected: maintainer '$login' reacted with :+1: (permission: $perm)."
                      break
                      ;;
                    *)
                      echo "Ignoring :+1: from '$login' — insufficient permission ($perm)."
                      ;;
                  esac
                done
              fi
            fi

            if [[ "$APPROVED" == "false" ]]; then
              DRY_RUN=true
              APPROVAL_REQUIRED=true
              echo "No maintainer approval detected — forcing dry-run mode until a maintainer approves."
            else
              echo "Approval confirmed — proceeding with auto-commit mode."
            fi
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Running in DRY-RUN mode — no commits will be pushed."
          else
            echo "Running in AUTO-COMMIT mode — changes will be committed automatically."
          fi
          echo ""

          # ── Shared marker & cleanup helper ───────────────────────────────────
          # Define MARKER early so the helper below can reference it before the
          # comment-posting block at step 6.
          MARKER="<!-- codeowners-rename-bot -->"

          # Load the shared helper (delete_bot_comment).  The script is kept
          # in a separate file so the unit-test suite can source the same
          # definition rather than maintaining a copy.
          # shellcheck source=.github/scripts/codeowners-bot-helpers.sh
          source ".github/scripts/codeowners-bot-helpers.sh"

          # ── 1. Collect all file-level renames in this PR ─────────────────────
          # Output format: R<score> TAB old-path TAB new-path
          mapfile -t rename_lines < <(
            git diff --diff-filter=R --name-status "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          )

          if [[ ${#rename_lines[@]} -eq 0 ]]; then
            echo "No renamed files detected in this PR — nothing to check."
            delete_bot_comment
            echo "Job summary: nothing to do (no file renames in this PR)."
            exit 0
          fi

          echo "Renamed files in this PR:"
          for line in "${rename_lines[@]}"; do
            echo "  $line"
          done
          echo ""

          # ── 2. Infer directory renames from file renames ─────────────────────
          # A directory rename shows up as many file renames sharing the same
          # old-prefix → new-prefix transformation.  We collect unique prefix
          # pairs where:
          #   • both old and new path contain a '/' (i.e. they are inside a dir)
          #   • the leading directory component changed

          declare -A dir_renames  # old_dir -> new_dir

          for line in "${rename_lines[@]}"; do
            # Strip the similarity score prefix (R090, R100, …) to get two paths
            old_path=$(echo "$line" | awk '{print $2}')
            new_path=$(echo "$line" | awk '{print $3}')

            old_dir=$(dirname "$old_path")
            new_dir=$(dirname "$new_path")

            # Skip files at repo root (dirname == ".")
            [[ "$old_dir" == "." ]] && continue
            [[ "$new_dir" == "." ]] && continue

            [[ "$old_dir" == "$new_dir" ]] && continue  # same directory

            # Walk up until we find the highest-level changed component.
            # Strategy: keep stripping the trailing path segment from both dirs
            # while the last segments differ, recording every unique pair.
            a="$old_dir"
            b="$new_dir"
            while [[ "$a" != "." && "$b" != "." ]]; do
              a_parent=$(dirname "$a")
              b_parent=$(dirname "$b")
              if [[ "$a_parent" == "$b_parent" ]]; then
                # a and b share the same parent → this is the renamed segment
                dir_renames["${a}/"]="${b}/"
                break
              fi
              a="$a_parent"
              b="$b_parent"
            done
          done

          if [[ ${#dir_renames[@]} -eq 0 ]]; then
            echo "No directory renames detected — nothing to check in CODEOWNERS."
            delete_bot_comment
            echo "Job summary: nothing to do (no directory renames in this PR)."
            exit 0
          fi

          echo "Inferred directory renames:"
          for old in "${!dir_renames[@]}"; do
            echo "  $old  →  ${dir_renames[$old]}"
          done
          echo ""

          # ── 3. Scan CODEOWNERS for rules referencing the old paths ───────────
          declare -a suggestions    # table rows for the PR comment
          declare -a replacements   # "old_pattern|||new_pattern" pairs for sed

          while IFS= read -r line; do
            # Skip comment-only lines and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue

            read -r -a fields <<< "$line"
            pattern="${fields[0]}"
            # Strip leading slash for comparison
            pattern_stripped="${pattern#/}"

            for old_dir in "${!dir_renames[@]}"; do
              new_dir="${dir_renames[$old_dir]}"

              # Match if the pattern starts with (or equals) the old directory path
              if [[ "$pattern_stripped" == "${old_dir}"* ]] || [[ "$pattern_stripped" == "${old_dir%/}" ]]; then
                updated_pattern="${pattern/$old_dir/$new_dir}"
                # Also handle the slash-prefixed variant
                updated_pattern="${updated_pattern/${old_dir%/}/${new_dir%/}}"

                owners="${fields[*]:1}"
                suggestions+=("| \`$pattern\` | \`$updated_pattern\` | $owners |")
                replacements+=("${pattern}|||${updated_pattern}")
                echo "Match: '$pattern' → '$updated_pattern'"
              fi
            done
          done < "$CODEOWNERS"

          if [[ ${#suggestions[@]} -eq 0 ]]; then
            echo "No CODEOWNERS rules reference the renamed directories — CODEOWNERS is already in sync."
            delete_bot_comment
            echo "Job summary: nothing to do (CODEOWNERS already reflects all renamed directories)."
            exit 0
          fi

          # ── 4. De-duplicate suggestion rows (edge case: same pattern matched
          #        by multiple rename pairs) ────────────────────────────────────
          declare -A seen_suggestions
          declare -a unique_suggestions
          declare -A seen_replacements
          declare -a unique_replacements

          for row in "${suggestions[@]}"; do
            if [[ -z "${seen_suggestions[$row]+_}" ]]; then
              seen_suggestions[$row]=1
              unique_suggestions+=("$row")
            fi
          done

          for repl in "${replacements[@]}"; do
            if [[ -z "${seen_replacements[$repl]+_}" ]]; then
              seen_replacements[$repl]=1
              unique_replacements+=("$repl")
            fi
          done

          # ── 5. Try to apply changes directly to CODEOWNERS and push ──────────
          # Skipped entirely in dry-run mode.
          PUSHED=false
          COMMITTED=false

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry-run mode active — skipping commit and push."
          else
            # Apply each replacement in-place using sed.
            # Escape all characters with special meaning in sed's s|…|…| syntax,
            # including the | delimiter itself.
            for repl in "${unique_replacements[@]}"; do
              old_pat="${repl%%|||*}"
              new_pat="${repl##*|||}"
              old_escaped=$(printf '%s' "$old_pat" | sed 's|[\\&/|]|\\&|g')
              new_escaped=$(printf '%s' "$new_pat" | sed 's|[\\&/|]|\\&|g')
              sed -i "s|${old_escaped}|${new_escaped}|g" "$CODEOWNERS"
              echo "Applied: '${old_pat}' → '${new_pat}'"
            done

            # Commit and push only when the file actually changed
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$CODEOWNERS"

            if git diff --cached --quiet; then
              echo "CODEOWNERS was already up to date — no commit needed."
              delete_bot_comment
              echo "Job summary: nothing to do (CODEOWNERS was already in sync — no commit pushed)."
              exit 0
            else
              git commit -m "chore: auto-update CODEOWNERS for renamed directories [skip ci]"

              if git push origin "HEAD:${HEAD_BRANCH}" 2>/dev/null; then
                PUSHED=true
                COMMITTED=true
                echo "Successfully pushed CODEOWNERS update to '${HEAD_BRANCH}'."
                echo "Job summary: changes applied (${#unique_replacements[@]} replacement(s) committed and pushed)."
              else
                echo "WARNING: Could not push to '${HEAD_BRANCH}' (fork PR or protected branch)."
                echo "Reverting local commit and falling back to comment-only mode."
                git reset HEAD~1
                git checkout -- "$CODEOWNERS"
              fi
            fi
          fi

          # ── 6. Post (or update) a PR comment ─────────────────────────────────
          # At this point CODEOWNERS needed changes and the bot either committed
          # them (COMMITTED=true), could not push (PUSHED=false), or is in
          # dry-run mode.  MARKER was defined earlier alongside delete_bot_comment.

          if [[ "$DRY_RUN" == "true" ]]; then
            # ── Dry-run comment ───────────────────────────────────────────────
            # Explain why no commit was made and what changes are pending.

            if [[ "$APPROVAL_REQUIRED" == "true" ]]; then
              # ── Approval-gate variant ─────────────────────────────────────
              # The bot is waiting for a maintainer sign-off before committing.
              table_rows=""
              for row in "${unique_suggestions[@]}"; do
                table_rows="${table_rows}
          ${row}"
              done

              body="${MARKER}
          ## :mag: CODEOWNERS — pending approval before auto-commit

          This PR renames one or more directories that are tracked in \`.github/CODEOWNERS\`.
          The repository is configured with \`CODEOWNERS_BOT_REQUIRE_APPROVAL=true\`, so the
          bot will **not** commit the fix automatically until a maintainer approves.

          The table below shows the changes that will be applied once approved:

          | Current pattern | Suggested pattern | Owners |
          |---|---|---|${table_rows}

          **To approve and allow the bot to commit on the next push:**
          - Submit a GitHub **review approval** on this PR (the green _Approve_ button), **or**
          - React to **this comment** with :+1:.

          The bot will detect the approval and auto-commit the fix on the next push to this branch.

          > _This preview was generated automatically by the \`suggest-codeowners-updates\` workflow._
          > _If the rename is intentional and the CODEOWNERS rule is no longer needed, simply_
          > _remove the old entry instead of updating it._"

            else
              # ── Standard dry-run variant (label / variable) ───────────────
              # Check whether dry-run was triggered by label, variable, or both.
              dry_run_reason=""
              if [[ "${DRY_RUN_VAR,,}" == "true" ]] && echo "${PR_LABELS}" | grep -qi '"codeowners-dry-run"'; then
                dry_run_reason="the repository variable \`CODEOWNERS_BOT_DRY_RUN\` is set to \`true\` **and** the PR carries the \`codeowners-dry-run\` label"
              elif [[ "${DRY_RUN_VAR,,}" == "true" ]]; then
                dry_run_reason="the repository variable \`CODEOWNERS_BOT_DRY_RUN\` is set to \`true\`"
              else
                dry_run_reason="the PR carries the \`codeowners-dry-run\` label"
              fi

              table_rows=""
              for row in "${unique_suggestions[@]}"; do
                table_rows="${table_rows}
          ${row}"
              done

              body="${MARKER}
          ## :mag: CODEOWNERS — dry-run preview (no changes committed)

          This PR renames one or more directories that are tracked in \`.github/CODEOWNERS\`.
          The bot is running in **dry-run mode** because ${dry_run_reason}.

          No commit has been pushed. The table below shows the changes that *would* be applied
          automatically once dry-run mode is disabled:

          | Current pattern | Suggested pattern | Owners |
          |---|---|---|${table_rows}

          **To apply the changes automatically:**
          - Remove the \`codeowners-dry-run\` label from this PR, **or**
          - Set the repository variable \`CODEOWNERS_BOT_DRY_RUN\` to \`false\` (or delete it).

          The bot will commit the fix on the next push to this branch.

          > _This preview was generated automatically by the \`suggest-codeowners-updates\` workflow._
          > _If the rename is intentional and the CODEOWNERS rule is no longer needed, simply_
          > _remove the old entry instead of updating it._"
            fi

          elif [[ "$PUSHED" == "true" ]]; then
            # ── Auto-commit comment ───────────────────────────────────────────
            if [[ "$COMMITTED" == "true" ]]; then
              update_note="The file has been **automatically updated** in a new commit on this branch — no manual changes are needed before merging."
            else
              update_note="The file was **already up to date** — no commit was needed."
            fi

            body="${MARKER}
          ## CODEOWNERS has been auto-updated

          This PR renamed one or more directories that were tracked in \`.github/CODEOWNERS\`.
          ${update_note}

          | Old pattern | New pattern | Owners |
          |---|---|---|"
            for row in "${unique_suggestions[@]}"; do
              body="${body}
          ${row}"
            done
            body="${body}

          > _This update was committed automatically by the \`suggest-codeowners-updates\` workflow._
          > _If the rename was unintentional, or the old CODEOWNERS rule should be removed instead_
          > _of renamed, you can edit \`.github/CODEOWNERS\` on this branch before merging._"
          else
            # ── Fall-back comment (push not possible — fork / protected branch) ─
            table_rows=""
            for row in "${unique_suggestions[@]}"; do
              table_rows="${table_rows}
          ${row}"
            done

            body="${MARKER}
          ## CODEOWNERS may need updating

          This PR renames one or more directories that are tracked in \`.github/CODEOWNERS\`.
          GitHub silently ignores rules whose path no longer exists, so no review will be
          requested for those paths until the file is updated.

          The bot tried to commit the fix automatically but could not push to this branch
          (this is expected for PRs from forks or branches with push restrictions).

          **Please update \`.github/CODEOWNERS\` manually before merging:**

          | Current pattern | Suggested pattern | Owners |
          |---|---|---|${table_rows}

          > _This comment is posted automatically by the \`suggest-codeowners-updates\` workflow._
          > _If the rename is intentional and the CODEOWNERS rule is no longer needed, simply_
          > _remove the old entry instead of updating it._"
          fi

          # Look for an existing bot comment to avoid spamming on every push.
          # Retry up to 3 times with a short back-off to handle transient API
          # failures (network blips, rate-limit bursts).  We track whether the
          # lookup actually succeeded so we never fall through to POST when the
          # list call itself errored — that would create a duplicate comment.
          existing_id=""
          lookup_ok=false
          for _attempt in 1 2 3; do
            # Use an `if` conditional so `set -e` does not abort the script
            # when `gh api` exits non-zero on a transient failure.
            # The gh api call succeeds (and _raw may be empty) when no bot
            # comment exists yet — that is the normal "first run" case.
            if _raw=$(
                 gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
                   --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
                   2>/dev/null | head -1
               ); then
              existing_id="$_raw"
              lookup_ok=true
              break
            fi
            echo "WARNING: comment-lookup attempt ${_attempt}/3 failed; retrying in 5 s …"
            sleep 5
          done

          if [[ "$lookup_ok" == "false" ]]; then
            echo "WARNING: Could not reliably list PR comments after 3 attempts."
            echo "Skipping POST to avoid creating a duplicate comment."
            echo "::warning::suggest-codeowners-updates: GitHub API comment-lookup failed 3 times in step 6 — no PR comment was posted. The suggested CODEOWNERS updates are listed in the job log. Check API rate limits or network connectivity and re-run the workflow."
            echo "### suggest-codeowners-updates warning" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub API comment-lookup failed after 3 attempts. **No PR comment was posted** to avoid creating a duplicate. The suggested CODEOWNERS updates are:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Current pattern | Suggested pattern | Owners |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for row in "${unique_suggestions[@]}"; do
              echo "| $row |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-running the workflow should resolve the API error and post the comment automatically." >> "$GITHUB_STEP_SUMMARY"
            echo "Suggested CODEOWNERS updates (apply these manually before merging):"
            for row in "${unique_suggestions[@]}"; do
              echo "  $row"
            done
          elif [[ -n "$existing_id" ]]; then
            echo "Updating existing bot comment #$existing_id …"
            if ! gh api "repos/$REPO/issues/comments/$existing_id" \
              --method PATCH \
              --field body="$body" 2>/dev/null; then
              echo "WARNING: Could not update the existing bot comment (insufficient permissions)."
              echo "This is expected on PRs from forks. Suggestions are still visible in the log above."
            fi
          else
            echo "Posting new bot comment on PR #$PR_NUMBER …"
            if ! gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body="$body" 2>/dev/null; then
              echo "WARNING: Could not post a PR comment (insufficient permissions)."
              echo "This is expected on PRs from forks where GITHUB_TOKEN lacks write access."
              echo ""
              echo "Suggested CODEOWNERS updates (apply these manually before merging):"
              for row in "${unique_suggestions[@]}"; do
                echo "  $row"
              done
            else
              echo ""
              if [[ "$APPROVAL_REQUIRED" == "true" ]]; then
                echo "Done. Approval-gate comment posted with ${#unique_suggestions[@]} pending change(s) — waiting for maintainer approval."
              elif [[ "$DRY_RUN" == "true" ]]; then
                echo "Done. Dry-run comment posted with ${#unique_suggestions[@]} pending change(s) — no commit was pushed."
              elif [[ "$PUSHED" == "true" ]]; then
                echo "Done. CODEOWNERS auto-updated and comment posted with ${#unique_suggestions[@]} change(s)."
              else
                echo "Done. Review comment posted with ${#unique_suggestions[@]} suggestion(s) (manual action required)."
              fi
            fi
          fi
