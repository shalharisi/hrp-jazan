name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to protect
        required: false
        default: main

permissions:
  administration: write

jobs:
  protect:
    name: Apply required CI status checks and review policy
    runs-on: ubuntu-latest
    steps:
      - name: Add required status checks and review policy on ${{ inputs.branch }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = "${{ inputs.branch }}";
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const requiredChecks = [
              "Check API codegen is up to date",
              "TypeScript typecheck",
              "Lint (ESLint + Prettier)",
              "Verify CODEOWNERS entries"
            ];

            // Fetch current branch protection (may not exist yet)
            let current = null;
            try {
              const { data } = await github.rest.repos.getBranchProtection({ owner, repo, branch });
              current = data;
            } catch (err) {
              if (err.status !== 404) throw err;
              console.log(`No existing branch protection found for '${branch}' — creating from scratch.`);
            }

            // Merge desired checks into existing ones (deduplicate)
            const existingContexts = current?.required_status_checks?.contexts ?? [];
            const mergedContexts = [...new Set([...existingContexts, ...requiredChecks])];

            // Preserve all existing settings; only update required_status_checks
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks: {
                strict: current?.required_status_checks?.strict ?? true,
                contexts: mergedContexts
              },
              // Preserve existing values; fall back to safe defaults when no rule existed yet.
              // enforce_admins must be a boolean — default false (do not enforce on admins).
              enforce_admins: current?.enforce_admins?.enabled ?? false,
              // Require at least 1 approving review; dismiss stale approvals on new commits.
              // Only writable fields are included to avoid sending read-only API response keys.
              required_pull_request_reviews: {
                required_approving_review_count: Math.max(
                  current?.required_pull_request_reviews?.required_approving_review_count ?? 0,
                  1
                ),
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                require_last_push_approval:
                  current?.required_pull_request_reviews?.require_last_push_approval ?? false,
                ...(current?.required_pull_request_reviews?.dismissal_restrictions
                  ? {
                      dismissal_restrictions: {
                        users: current.required_pull_request_reviews.dismissal_restrictions.users?.map(u => u.login) ?? [],
                        teams: current.required_pull_request_reviews.dismissal_restrictions.teams?.map(t => t.slug) ?? [],
                        apps:  current.required_pull_request_reviews.dismissal_restrictions.apps?.map(a => a.slug) ?? []
                      }
                    }
                  : {}),
                ...(current?.required_pull_request_reviews?.bypass_pull_request_allowances
                  ? {
                      bypass_pull_request_allowances: {
                        users: current.required_pull_request_reviews.bypass_pull_request_allowances.users?.map(u => u.login) ?? [],
                        teams: current.required_pull_request_reviews.bypass_pull_request_allowances.teams?.map(t => t.slug) ?? [],
                        apps:  current.required_pull_request_reviews.bypass_pull_request_allowances.apps?.map(a => a.slug) ?? []
                      }
                    }
                  : {})
              },
              restrictions: current?.restrictions
                ? {
                    users: current.restrictions.users.map(u => u.login),
                    teams: current.restrictions.teams.map(t => t.slug),
                    apps:  current.restrictions.apps.map(a => a.slug)
                  }
                : null
            });

            console.log(`Branch protection updated for '${branch}'.`);
            console.log(`Required status checks (${mergedContexts.length} total):`);
            mergedContexts.forEach(c => console.log(`  - ${c}`));
            console.log(`Required approving reviews: 1 (stale reviews dismissed on new commits).`);
