name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Lightweight guard: uses the detect-bot-commit composite action to check
  # whether the HEAD commit is an automated bot commit that should skip CI.
  # Works for both `push` events and `pull_request` synchronize events (where
  # GitHub's native [skip ci] support does not apply).
  # All downstream jobs depend on this output and skip when proceed == 'false'.
  should-run:
    name: Detect bot commit
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: guard
        uses: ./.github/actions/detect-bot-commit

  test-bot-detection:
    name: Smoke-test bot-detection guard
    runs-on: ubuntu-latest
    # Intentionally ungated: this job must always run so it can catch regressions
    # in the guard itself.  If it depended on `should-run`, a broken guard that
    # returns proceed=false for human actors would silently skip this check.
    steps:
      - uses: actions/checkout@v4

      - name: Run bot-detection smoke tests
        run: bash scripts/test-bot-detection.sh

  check-codegen:
    name: Check API codegen is up to date
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.proceed != 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Fail if generated files are out of sync
        run: |
          if ! git diff --quiet -- lib/api-client-react/src/generated lib/api-zod/src/generated lib/api-spec/.codegen-hash lib/api-spec/.codegen-output-hash; then
            echo ""
            echo "ERROR: openapi.yaml was changed but the generated files were not updated."
            echo "Run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the result."
            echo ""
            echo "=== diff of out-of-sync generated files ==="
            git diff -- lib/api-client-react/src/generated lib/api-zod/src/generated lib/api-spec/.codegen-hash lib/api-spec/.codegen-output-hash
            exit 1
          fi
          echo "Generated files are in sync with openapi.yaml."

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: [should-run, check-codegen]
    if: needs.should-run.outputs.proceed != 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  check-ui-stubs:
    name: Check artifact ui/ directories are re-export stubs
    runs-on: ubuntu-latest
    needs: should-run
    if: needs.should-run.outputs.proceed != 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify ui/ stubs
        run: node --input-type=module <<'EOF'
            import { readdirSync, readFileSync } from 'fs';
            import { join, relative } from 'path';
            const STUB_RE = /^export\s+(\*|\{[^}]+\})\s+from\s+["']@workspace\/ui["'];?$/;
            const dirs = ['artifacts/hrp-tracker/src/components/ui', 'artifacts/mockup-sandbox/src/components/ui'];
            let failed = false;
            for (const dir of dirs) {
              let files;
              try { files = readdirSync(dir); } catch { continue; }
              for (const f of files) {
                if (!f.endsWith('.tsx') && !f.endsWith('.ts')) continue;
                const content = readFileSync(join(dir, f), 'utf8').trim();
                if (!STUB_RE.test(content)) {
                  console.error(`ERROR: ${relative('.', join(dir, f))} is not a re-export stub.`);
                  failed = true;
                }
              }
            }
            if (failed) process.exit(1);
            console.log('All artifact ui/ stubs are valid.');
          EOF

  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    needs: [should-run, check-codegen]
    if: needs.should-run.outputs.proceed != 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint
