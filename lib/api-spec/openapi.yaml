openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: High-Risk Pregnancy Tracker API – Jazan Health Cluster 2026
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: reference
    description: Reference data (sectors, hospitals, health centers)
  - name: patients
    description: Patient management
  - name: pregnancies
    description: Pregnancy case management
  - name: appointments
    description: Appointment management
  - name: dashboard
    description: KPI dashboard and analytics
  - name: alerts
    description: System alerts
  - name: users
    description: User management (admin only)
  - name: audit
    description: Audit log (admin only)

paths:

  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Logout (invalidate refresh token cookie)
      description: >
        Public endpoint — does not require a valid access token.
        Always clears the hrp_refresh_token httpOnly cookie.
        Audit log is written on a best-effort basis if a bearer token is present.
      security: []
      responses:
        "200":
          description: Logout successful

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Refresh access token using httpOnly refresh token cookie
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
        "401":
          description: Refresh token missing or expired

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /auth/consent:
    post:
      operationId: authConsent
      tags: [auth]
      summary: Record PDPL data protection consent for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent recorded

  # ─── Users (admin only) ────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "409":
          description: Username already exists

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found

  # ─── Audit Logs (admin only) ───────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  total:
                    type: integer

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Reference Data ───────────────────────────────────────────────────────
  /sectors:
    get:
      operationId: listSectors
      tags: [reference]
      summary: List all sectors
      responses:
        "200":
          description: List of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"

  /hospitals:
    get:
      operationId: listHospitals
      tags: [reference]
      summary: List all hospitals
      responses:
        "200":
          description: List of hospitals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hospital"

  /health-centers:
    get:
      operationId: listHealthCenters
      tags: [reference]
      summary: List health centers, optionally filtered by sector
      parameters:
        - name: sectorId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of health centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthCenter"

  # ─── Patients ─────────────────────────────────────────────────────────────
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients with optional search
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by national ID or name
        - name: sectorId
          in: query
          required: false
          schema:
            type: integer
        - name: healthCenterId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated list of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientList"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Patient with this national ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /patients/by-nid/{nationalId}:
    get:
      operationId: getPatientByNid
      tags: [patients]
      summary: Look up a patient by national ID
      parameters:
        - name: nationalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient with pregnancy history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientWithPregnancies"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Pregnancies ──────────────────────────────────────────────────────────
  /pregnancies:
    get:
      operationId: listPregnancies
      tags: [pregnancies]
      summary: List pregnancy cases with filters
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
        - name: riskLevel
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: hospitalId
          in: query
          required: false
          schema:
            type: integer
        - name: sectorId
          in: query
          required: false
          schema:
            type: integer
        - name: compliance
          in: query
          required: false
          schema:
            type: string
            enum: [compliant, non_compliant, pending]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated list of pregnancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregnancyList"
    post:
      operationId: createPregnancy
      tags: [pregnancies]
      summary: Create a new pregnancy case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregnancyInput"
      responses:
        "201":
          description: Created pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pregnancy"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{id}:
    get:
      operationId: getPregnancy
      tags: [pregnancies]
      summary: Get pregnancy case by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pregnancy details with patient info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregnancyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePregnancy
      tags: [pregnancies]
      summary: Update pregnancy case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregnancyUpdate"
      responses:
        "200":
          description: Updated pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pregnancy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Appointments ─────────────────────────────────────────────────────────
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: pregnancyId
          in: query
          required: false
          schema:
            type: integer
        - name: hospitalId
          in: query
          required: false
          schema:
            type: integer
        - name: attended
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment (attendance, reschedule)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete (cancel) an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Appointment deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard ────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overall KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/by-sector:
    get:
      operationId: getDashboardBySector
      tags: [dashboard]
      summary: Case distribution by sector
      responses:
        "200":
          description: Per-sector breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorStats"

  /dashboard/by-hospital:
    get:
      operationId: getDashboardByHospital
      tags: [dashboard]
      summary: Case distribution by hospital
      responses:
        "200":
          description: Per-hospital breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HospitalStats"

  /dashboard/by-risk-level:
    get:
      operationId: getDashboardByRiskLevel
      tags: [dashboard]
      summary: Case distribution by risk level
      responses:
        "200":
          description: Per-risk-level breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskLevelStats"

  /dashboard/compliance:
    get:
      operationId: getDashboardCompliance
      tags: [dashboard]
      summary: Booking compliance KPIs
      responses:
        "200":
          description: Compliance stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceStats"

  # ─── Alerts ───────────────────────────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Get active alerts (VTE without Enoxaparin, critical without appointments)
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth ──────────────────────────────────────────────────────────────────
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, username, role, nameAr]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, coordinator, doctor, viewer]
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        sectorId:
          type: ["string", "null"]
        isActive:
          type: boolean
        lastLogin:
          type: ["string", "null"]
          format: date-time
        consentGivenAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserCreateInput:
      type: object
      required: [username, password, role, nameAr]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, coordinator, doctor, viewer]
        nameAr:
          type: string
        nameEn:
          type: string
        sectorId:
          type: string

    UserUpdateInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, coordinator, doctor, viewer]
        nameAr:
          type: string
        nameEn:
          type: string
        sectorId:
          type: string
        isActive:
          type: boolean
        password:
          type: string
          minLength: 8

    AuditLog:
      type: object
      required: [id, action, resourceType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        username:
          type: ["string", "null"]
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ─── General ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ─── Reference entities ────────────────────────────────────────────────
    Sector:
      type: object
      required: [id, nameAr, nameEn, hospitalId]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        hospitalId:
          type: integer
        hospitalNameAr:
          type: ["string", "null"]
        hospitalNameEn:
          type: ["string", "null"]
        healthCenterCount:
          type: ["integer", "null"]

    Hospital:
      type: object
      required: [id, nameAr, nameEn, isKfch]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: string
        isKfch:
          type: boolean
        totalCases:
          type: ["integer", "null"]

    HealthCenter:
      type: object
      required: [id, nameAr, sectorId]
      properties:
        id:
          type: integer
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        sectorId:
          type: integer
        sectorNameAr:
          type: ["string", "null"]

    # ─── Patient ──────────────────────────────────────────────────────────
    Patient:
      type: object
      required: [id, nationalId, nameAr, phone, healthCenterId, sectorId, createdAt]
      properties:
        id:
          type: integer
        nationalId:
          type: string
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        phone:
          type: string
        doctorPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        healthCenterId:
          type: integer
        healthCenterNameAr:
          type: ["string", "null"]
        sectorId:
          type: integer
        sectorNameAr:
          type: ["string", "null"]
        totalPregnancies:
          type: ["integer", "null"]
        createdAt:
          type: string

    PatientInput:
      type: object
      required: [nationalId, nameAr, phone, healthCenterId]
      properties:
        nationalId:
          type: string
          minLength: 10
          maxLength: 10
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        phone:
          type: string
        doctorPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        healthCenterId:
          type: integer

    PatientUpdate:
      type: object
      properties:
        nameAr:
          type: string
        nameEn:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        phone:
          type: string
        doctorPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        healthCenterId:
          type: integer

    PatientList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer

    PatientWithPregnancies:
      type: object
      required: [patient, pregnancies]
      properties:
        patient:
          $ref: "#/components/schemas/Patient"
        pregnancies:
          type: array
          items:
            $ref: "#/components/schemas/Pregnancy"

    # ─── Pregnancy ────────────────────────────────────────────────────────
    Pregnancy:
      type: object
      required: [id, patientId, visitDate, gestationalAge, riskLevel, referralRecommendation, compliance, createdAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        patientNameAr:
          type: ["string", "null"]
        patientNationalId:
          type: ["string", "null"]
        visitDate:
          type: string
        lmpDate:
          type: ["string", "null"]
        gestationalAge:
          type: ["integer", "null"]
          description: Gestational age in weeks
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        riskFactors:
          type: array
          items:
            type: string
          description: "Field 13: General obstetric risk factors"
        pregnancyRiskFactors:
          type: array
          items:
            type: string
          description: "Field 14: Pregnancy-related or current health risk factors"
        medicalConditions:
          type: array
          items:
            type: string
          description: "Field 15: General medical conditions"
        medications:
          type: ["string", "null"]
          description: "Field 16: Contraindicated medications (Warfarin, isotretinoin, etc.)"
        isVteHighRisk:
          type: boolean
        enoxaparinPrescribed:
          type: boolean
        referralExplained:
          type: ["boolean", "null"]
          description: "Field 19: Did doctor explain referral to patient?"
        doctorName:
          type: ["string", "null"]
        referralRecommendation:
          type: string
          enum: [follow_at_center, follow_at_hospital, transfer_kfch]
        referredHospitalId:
          type: ["integer", "null"]
        referredHospitalNameAr:
          type: ["string", "null"]
        appointmentDate:
          type: ["string", "null"]
        compliance:
          type: string
          enum: [compliant, non_compliant, pending]
          description: "compliant: <=2 working days, non_compliant: >2, pending: no appointment yet"
        workingDaysToAppointment:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        followUpNotes:
          type: ["string", "null"]
